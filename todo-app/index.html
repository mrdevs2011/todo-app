<!-- todo-app/index.html -->
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  .app {
    background: #fff;
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    overflow: hidden;
  }
  header {
    padding: 24px 24px 16px;
    background: #4f46e5;
    color: #fff;
  }
  header h1 { font-size: 22px; font-weight: 600; }
  header p { font-size: 13px; opacity: .8; margin-top: 4px; }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    border-bottom: 1px solid #eef0f4;
  }
  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d7dbe3;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  .input-row input:focus { border-color: #4f46e5; }
  .input-row button {
    padding: 12px 18px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .input-row button:hover { background: #4338ca; }
  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 24px;
    border-bottom: 1px solid #eef0f4;
  }
  .filters button {
    padding: 6px 12px;
    background: transparent;
    border: 1px solid #d7dbe3;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    color: #4b5563;
  }
  .filters button.active {
    background: #eef2ff;
    border-color: #4f46e5;
    color: #4f46e5;
    font-weight: 600;
  }
  ul { list-style: none; max-height: 55vh; overflow-y: auto; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid #f1f3f7;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px);} to {opacity:1; transform:none;} }
  li input[type="checkbox"] {
    width: 18px; height: 18px; cursor: pointer; accent-color: #4f46e5;
  }
  li .text {
    flex: 1;
    font-size: 15px;
    color: #1f2937;
    word-break: break-word;
  }
  li.done .text { text-decoration: line-through; color: #9ca3af; }
  li .del {
    background: transparent;
    border: none;
    color: #ef4444;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    opacity: 0;
    transition: opacity .15s, background .15s;
  }
  li:hover .del { opacity: 1; }
  li .del:hover { background: #fee2e2; }
  .empty {
    padding: 40px 24px;
    text-align: center;
    color: #9ca3af;
    font-size: 14px;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 24px;
    background: #f9fafb;
    font-size: 13px;
    color: #6b7280;
  }
  footer button {
    background: transparent;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 13px;
  }
  footer button:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📝 Todo App</h1>
      <p>Vazifalaringizni saqlab boring</p>
    </header>

    <div class="input-row">
      <input id="input" type="text" placeholder="Yangi vazifa yozing..." autocomplete="off" />
      <button id="addBtn">Qo'shish</button>
    </div>

    <div class="filters">
      <button data-filter="all" class="active">Barchasi</button>
      <button data-filter="active">Faol</button>
      <button data-filter="done">Bajarilgan</button>
    </div>

    <ul id="list"></ul>

    <footer>
      <span id="counter">0 ta vazifa</span>
      <button id="clearDone">Bajarilganlarni tozalash</button>
    </footer>
  </div>

<script>
(function () {
  const STORAGE_KEY = "deepwork.todo.v1";

  const input    = document.getElementById("input");
  const addBtn   = document.getElementById("addBtn");
  const list     = document.getElementById("list");
  const counter  = document.getElementById("counter");
  const clearBtn = document.getElementById("clearDone");
  const filterBtns = document.querySelectorAll(".filters button");

  /** @type {{id:number, text:string, done:boolean}[]} */
  let todos = load();
  let filter = "all";

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (_) { return []; }
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch (_) {}
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now(), text, done: false });
    input.value = "";
    save();
    render();
  }

  function toggle(id) {
    const t = todos.find(x => x.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function remove(id) {
    todos = todos.filter(x => x.id !== id);
    save();
    render();
  }

  function clearDone() {
    todos = todos.filter(x => !x.done);
    save();
    render();
  }

  function visibleTodos() {
    if (filter === "active") return todos.filter(t => !t.done);
    if (filter === "done")   return todos.filter(t =>  t.done);
    return todos;
  }

  function render() {
    const items = visibleTodos();
    list.innerHTML = "";

    if (items.length === 0) {
      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = todos.length === 0
        ? "Hozircha vazifa yo'q. Yangi vazifa qo'shing!"
        : "Bu filtrda vazifa topilmadi.";
      list.appendChild(div);
    } else {
      for (const t of items) {
        const li = document.createElement("li");
        if (t.done) li.classList.add("done");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = t.done;
        cb.addEventListener("change", () => toggle(t.id));

        const span = document.createElement("span");
        span.className = "text";
        span.textContent = t.text;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.title = "O'chirish";
        del.addEventListener("click", () => remove(t.id));

        li.append(cb, span, del);
        list.appendChild(li);
      }
    }

    const activeCount = todos.filter(t => !t.done).length;
    counter.textContent = `${activeCount} ta faol / ${todos.length} ta jami`;
  }

  // Events
  addBtn.addEventListener("click", addTodo);
  input.addEventListener("keydown", e => { if (e.key === "Enter") addTodo(); });
  clearBtn.addEventListener("click", clearDone);

  filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      filterBtns.forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
